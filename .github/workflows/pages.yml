name: Sync Notion and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: commission-status-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project metadata
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync current Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SOURCES_JSON: ${{ vars.NOTION_SOURCES_JSON }}
        run: npm run sync

      - name: Validate generated site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          heartbeat_month="$(date -u +%Y-%m)"
          heartbeat_file=".github/schedule-heartbeat"
          current_month="$(cat "$heartbeat_file" 2>/dev/null || true)"

          if [ "$current_month" != "$heartbeat_month" ]; then
            printf '%s\n' "$heartbeat_month" > "$heartbeat_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$heartbeat_file"
            git commit -m "chore: refresh workflow heartbeat"
            if ! git push; then
              echo "::warning::Heartbeat push was skipped because the branch changed."
            fi
          fi
